name: Manually deploy verified Pages artifact
on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful main-branch Verify game run ID (uses its existing build)
        required: true
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the Pages relay destination
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: test -n "$RELAY_URL"
      - name: Require a successful verification of main
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(context.payload.inputs.verification_run)
            });
            if (run.data.conclusion !== 'success' || run.data.head_branch !== 'main' ||
                run.data.path !== '.github/workflows/verify.yml') {
              throw new Error('Select a successful main-branch Verify game run.');
            }
      - uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: dist
          run-id: ${{ inputs.verification_run }}
          github-token: ${{ github.token }}
      - name: Verify the artifact's public relay destination
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const info = JSON.parse(readFileSync('dist/build-info.json', 'utf8'));
          if (!info.relay || info.relay !== process.env.RELAY_URL || new URL(info.relay).protocol !== 'https:') {
            throw new Error('Artifact relay differs from RELAY_URL. Verify main again with the intended destination.');
          }
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
