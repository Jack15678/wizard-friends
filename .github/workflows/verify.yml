name: Verify game
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'AGENTS.md', '.dev-memory.json']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'AGENTS.md', '.dev-memory.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - run: npm run worker:check
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Three-client smoke against local Durable Objects
        run: |
          npm run dev:relay > /tmp/wizard-worker.log 2>&1 &
          npm run dev > /tmp/wizard-vite.log 2>&1 &
          trap 'cat /tmp/wizard-worker.log /tmp/wizard-vite.log' EXIT
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health > /dev/null
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:5173/ > /dev/null
          GAME_URL=http://127.0.0.1:5173/ BROWSER_CHANNEL=chromium npm run test:smoke
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: output/playwright/
          retention-days: 7
      - name: Save verified frontend for deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: dist/
          retention-days: 7
  deploy-cloudflare:
    needs: verify
    if: github.repository == 'xsk23/wizard-friends' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository Actions secrets.'
            exit 1
          fi
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-frontend
          path: dist
      - name: Check verified artifact revision and relay
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const info = JSON.parse(readFileSync('dist/build-info.json', 'utf8'));
          if (info.revision !== process.env.GITHUB_SHA) throw new Error('Artifact revision differs from this verified commit.');
          if (info.relay && info.relay.replace(/\/$/, '') !== 'https://wizard-friends.wizard-friends.workers.dev') {
            throw new Error('Clear RELAY_URL or set it to the production Worker before verifying again.');
          }
          JS
      - name: Deploy verified frontend and Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployed health endpoint
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 --max-time 20 https://wizard-friends.wizard-friends.workers.dev/api/health
